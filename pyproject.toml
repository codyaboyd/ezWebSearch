[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezwebsearch"
version = "0.1.0"
description = "Python client for the ezWebSearch SearXNG-backed web search API"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ezWebSearch contributors" },
]
dependencies = [
  "httpx>=0.24",
]

[project.optional-dependencies]
server = [
  "fastapi",
  "uvicorn[standard]",
  "trafilatura",
  "playwright",
]
dev = [
  "build",
]

[tool.setuptools]
packages = ["ezwebsearch"]
py-modules = ["api", "cli", "local_searxng", "search_service"]

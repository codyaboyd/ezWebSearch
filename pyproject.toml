[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ezwebsearch"
version = "0.1.0"
description = "Self-hostable SearXNG-backed web search service and Python client"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "ezWebSearch contributors" },
]
dependencies = [
  "httpx>=0.24",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "trafilatura>=1.8,<3",
  "playwright>=1.45,<2",
  "python-dotenv>=1.0,<2",
]
dev = [
  "build>=1.2,<2",
]

[project.scripts]
ezwebsearch = "cli:main"
ezwebsearch-api = "api:main"

[tool.setuptools]
packages = ["ezwebsearch"]
py-modules = ["api", "cli", "config", "local_searxng", "runtime", "search_service"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

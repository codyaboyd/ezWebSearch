use_default_settings: true

general:
  instance_name: "SearXNG for ezWebSearch"

search:
  formats:
    - html
    - json

server:
  # Compose publishes this instance on host port 6667. Replace this value and
  # review the limiter settings before exposing it beyond a trusted network.
  secret_key: "ezwebsearch-local-development-secret-change-me"
  bind_address: "0.0.0.0"
  port: 8080
  limiter: false

services:
  searxng:
    image: ${SEARXNG_DOCKER_IMAGE:-docker.io/searxng/searxng:latest}
    restart: unless-stopped
    environment:
      BIND_ADDRESS: 0.0.0.0:8080
      FORCE_OWNERSHIP: "false"
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./docker/searxng:/etc/searxng:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ezwebsearch:
    build: .
    restart: unless-stopped
    depends_on:
      searxng:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      SEARXNG_URL: http://searxng:8080
      HTTP_CONCURRENCY: ${HTTP_CONCURRENCY:-10}
      BROWSER_CONCURRENCY: ${BROWSER_CONCURRENCY:-3}
      PAGE_TIMEOUT_SECONDS: ${PAGE_TIMEOUT_SECONDS:-15}
      SEARCH_TIMEOUT_SECONDS: ${SEARCH_TIMEOUT_SECONDS:-10}
      BROWSER_TIMEOUT_MS: ${BROWSER_TIMEOUT_MS:-20000}
      BROWSER_SETTLE_MS: ${BROWSER_SETTLE_MS:-750}
      MAX_PAGE_BYTES: ${MAX_PAGE_BYTES:-5242880}
      MIN_TEXT_LENGTH: ${MIN_TEXT_LENGTH:-300}
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-false}
    ports:
      - "${PORT:-3000}:3000"

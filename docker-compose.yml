services:
  searxng:
    image: ${SEARXNG_DOCKER_IMAGE:-docker.io/searxng/searxng:latest}
    restart: unless-stopped
    environment:
      BIND_ADDRESS: 0.0.0.0:8080
      FORCE_OWNERSHIP: "false"
      SEARXNG_BASE_URL: http://127.0.0.1:6667/
    volumes:
      - ./docker/searxng:/etc/searxng:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "6667:8080"
